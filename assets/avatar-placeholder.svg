<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="meshGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#0B0F19"/>
  <circle cx="200" cy="200" r="180" fill="url(#meshGlow)"/>
  <circle cx="200" cy="200" r="145" fill="#111827" stroke="url(#avatarGrad)" stroke-width="4" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="128" fill="#182234"/>
  <g filter="url(#glow)">
    <text x="200" y="222" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="76" font-weight="800" fill="url(#avatarGrad)" text-anchor="middle" letter-spacing="2">MR</text>
  </g>
  <rect x="110" y="260" width="180" height="30" rx="15" fill="#1E293B" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="200" y="280" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#E0E7FF" text-anchor="middle" letter-spacing="1">MUBASHIR REHMAN</text>
</svg>