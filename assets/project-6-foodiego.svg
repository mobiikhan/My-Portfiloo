<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="foodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#27150A"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#foodBg)"/>
  <circle cx="480" cy="240" r="160" fill="#F97316" opacity="0.12" filter="blur(50px)"/>

  <!-- Left Info -->
  <text x="80" y="160" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FB923C" letter-spacing="2">MOBILE APPLICATION DESIGN</text>
  <text x="80" y="205" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">FoodieGo</text>
  <text x="80" y="245" font-family="system-ui, sans-serif" font-size="13" fill="#A1A1AA">Speedy food delivery UX with category carousels,</text>
  <text x="80" y="265" font-family="system-ui, sans-serif" font-size="13" fill="#A1A1AA">customizable meal options &amp; 1-tap checkout.</text>

  <rect x="80" y="310" width="140" height="36" rx="10" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
  <text x="150" y="333" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FDBA74" text-anchor="middle">&#9889; 20-30 Min ETA</text>

  <!-- Mobile Phone Mockup Frame -->
  <g transform="translate(450, 45)">
    <!-- Device Body -->
    <rect x="0" y="0" width="240" height="420" rx="36" fill="#09090B" stroke="#3F3F46" stroke-width="3"/>
    <!-- Screen -->
    <rect x="10" y="10" width="220" height="400" rx="28" fill="#18181B"/>
    <!-- Dynamic Island / Notch -->
    <rect x="75" y="18" width="70" height="14" rx="7" fill="#09090B"/>
    
    <!-- App Header -->
    <text x="25" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#A1A1AA">DELIVER TO</text>
    <text x="25" y="72" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Home, Sector F-7 &#9662;</text>
    <circle cx="195" cy="62" r="14" fill="#27272A"/>
    <text x="195" y="66" font-family="system-ui, sans-serif" font-size="10" fill="#F97316" text-anchor="middle">&#128722;</text>

    <!-- Food Hero Card inside phone -->
    <rect x="25" y="95" width="170" height="130" rx="16" fill="url(#orangeGrad)"/>
    <text x="40" y="130" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">Double Smashed</text>
    <text x="40" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Cheese Burger</text>
    <text x="40" y="178" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">$8.99</text>
    
    <circle cx="160" cy="172" r="16" fill="#FFFFFF"/>
    <text x="160" y="177" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#EA580C" text-anchor="middle">+</text>

    <!-- Mini Categories -->
    <rect x="25" y="240" width="48" height="48" rx="10" fill="#27272A"/>
    <text x="49" y="270" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">&#127828;</text>
    <rect x="85" y="240" width="48" height="48" rx="10" fill="#27272A"/>
    <text x="109" y="270" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">&#127829;</text>
    <rect x="145" y="240" width="48" height="48" rx="10" fill="#27272A"/>
    <text x="169" y="270" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">&#129380;</text>

    <!-- Bottom Nav -->
    <rect x="10" y="360" width="220" height="40" rx="0" fill="#09090B"/>
    <circle cx="55" cy="380" r="4" fill="#F97316"/>
    <circle cx="110" cy="380" r="4" fill="#52525B"/>
    <circle cx="165" cy="380" r="4" fill="#52525B"/>
  </g>
</svg>