<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="watchAppBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#watchAppBg)"/>
  <circle cx="500" cy="250" r="190" fill="#38BDF8" opacity="0.1" filter="blur(60px)"/>

  <!-- Left Side: Product Configurator -->
  <rect x="70" y="70" width="320" height="360" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <text x="100" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">STUDIO CONFIGURATOR</text>
  <text x="100" y="145" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">Chronos Titanium</text>
  <text x="100" y="172" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">Automatic Swiss Movement · 42mm Case</text>

  <!-- Strap Selection Chips -->
  <text x="100" y="215" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#E2E8F0">STRAP MATERIAL</text>
  <rect x="100" y="230" width="75" height="28" rx="6" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1"/>
  <text x="137" y="248" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#38BDF8" text-anchor="middle">Titanium</text>
  <rect x="185" y="230" width="75" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="222" y="248" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94A3B8" text-anchor="middle">Leather</text>
  <rect x="270" y="230" width="75" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="307" y="248" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94A3B8" text-anchor="middle">Rubber</text>

  <!-- Price & Action -->
  <text x="100" y="320" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#F8FAFC">$1,890</text>
  <text x="100" y="340" font-family="system-ui, sans-serif" font-size="10.5" fill="#4ADE80">&#10003; 5-Year Global Warranty Included</text>

  <rect x="100" y="365" width="260" height="40" rx="8" fill="#0284C7"/>
  <text x="230" y="390" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Add to Collection</text>

  <!-- Right Visual Watch Art -->
  <circle cx="580" cy="250" r="130" fill="#020617" stroke="url(#silverGrad)" stroke-width="6"/>
  <circle cx="580" cy="250" r="115" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <!-- Hour Markers -->
  <line x1="580" y1="145" x2="580" y2="160" stroke="#38BDF8" stroke-width="3"/>
  <line x1="580" y1="340" x2="580" y2="355" stroke="#38BDF8" stroke-width="3"/>
  <line x1="475" y1="250" x2="490" y2="250" stroke="#38BDF8" stroke-width="3"/>
  <line x1="670" y1="250" x2="685" y2="250" stroke="#38BDF8" stroke-width="3"/>
  <!-- Hands -->
  <line x1="580" y1="250" x2="580" y2="180" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round"/>
  <line x1="580" y1="250" x2="635" y2="280" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="580" cy="250" r="7" fill="#38BDF8"/>
</svg>