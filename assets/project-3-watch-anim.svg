<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="watchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="dialGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="85%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#watchBg)"/>
  
  <!-- Ambient Gold Glow -->
  <circle cx="520" cy="250" r="180" fill="#D97706" opacity="0.12" filter="blur(60px)"/>

  <!-- Left Content Info -->
  <text x="80" y="150" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F59E0B" letter-spacing="3">CHRONOGRAPH SERIES</text>
  <text x="80" y="195" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC">AURA PRECISION</text>
  <text x="80" y="235" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">Kinetic rotor movement with sapphire crystal</text>
  <text x="80" y="255" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">and 3D interactive web animation.</text>
  
  <text x="80" y="315" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="url(#gold)">$2,450</text>
  <rect x="80" y="340" width="160" height="42" rx="21" fill="url(#gold)"/>
  <text x="160" y="366" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">DISCOVER SPEC</text>

  <!-- Watch Dial Mockup -->
  <!-- Strap Top & Bottom -->
  <rect x="480" y="30" width="80" height="80" rx="10" fill="#1E293B" stroke="#334155"/>
  <rect x="480" y="390" width="80" height="80" rx="10" fill="#1E293B" stroke="#334155"/>

  <!-- Case Bezel -->
  <circle cx="520" cy="250" r="145" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <circle cx="520" cy="250" r="138" fill="url(#dialGrad)" stroke="#475569" stroke-width="2"/>
  
  <!-- Subdials -->
  <circle cx="520" cy="200" r="30" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <circle cx="480" cy="265" r="24" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <circle cx="560" cy="265" r="24" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  
  <!-- Hands -->
  <line x1="520" y1="250" x2="520" y2="160" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
  <line x1="520" y1="250" x2="590" y2="230" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
  <line x1="520" y1="250" x2="470" y2="290" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="520" cy="250" r="5" fill="#EF4444"/>
  
  <!-- Interactive Badge -->
  <rect x="630" y="80" width="110" height="32" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="685" y="101" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#FCD34D" text-anchor="middle">&#10022; 3D Motion UI</text>
</svg>